workflows:
  android-workflow:
    name: al7ay Android Build
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      node: 22
      groups:
        - google_play_credentials # Add your Google Play service account key in Codemagic UI
      vars:
        VITE_SUPABASE_URL: "https://xkkrcpokwxhmhhscfmby.supabase.co"
        VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_sNlcd4WibHxkDZbdu2cRyQ_fES3dqd0"
        VITE_SUPABASE_PROJECT_ID: "xkkrcpokwxhmhhscfmby"
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web assets
        script: |
          npm run build
      - name: Sync Capacitor
        script: |
          npx cap sync android
      - name: Build Android AAB
        script: |
          cd android && ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - support@al7ay.com # Update to your email
        notify:
          success: true
          failure: true

  ios-workflow:
    name: al7ay iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Zyiarah Key
    environment:
      node: 22
      xcode: latest
      groups:
        - ios_signing # Add CERTIFICATE_PRIVATE_KEY (secure) in Codemagic UI
      vars:
        VITE_SUPABASE_URL: "https://xkkrcpokwxhmhhscfmby.supabase.co"
        VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_sNlcd4WibHxkDZbdu2cRyQ_fES3dqd0"
        VITE_SUPABASE_PROJECT_ID: "xkkrcpokwxhmhhscfmby"
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web assets
        script: |
          npm run build
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.erihdev.al7ay" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App" \
            --config "Release"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - support@al7ay.com # Update to your email
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
