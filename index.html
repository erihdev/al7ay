  <!-- Theme Detection - Early execution to prevent white flash on app launch -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('theme') || 'system';
        var resolved;
        if (theme === 'dark' || theme === 'light') {
          resolved = theme;
        } else if (theme === 'auto') {
          var hour = new Date().getHours();
          resolved = (hour >= 6 && hour < 18) ? 'light' : 'dark';
        } else {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.add(resolved);
        document.documentElement.style.backgroundColor = resolved === 'dark' ? 'hsl(30,25%,8%)' : 'hsl(38,30%,97%)';
        document.documentElement.style.colorScheme = resolved;
      } catch (e) {
        document.documentElement.classList.add('light');
        document.documentElement.style.backgroundColor = 'hsl(38,30%,97%)';
      }
    })();
  </script>

  <!-- RTL Detection - Early execution to prevent FOUT -->
  <script>
    (function () {
      try {
        var lng = localStorage.getItem('i18nextLng') || 'ar';
        if (lng.startsWith('ar')) {
          document.documentElement.dir = 'rtl';
          document.documentElement.lang = 'ar';
        } else {
          document.documentElement.dir = 'ltr';
          document.documentElement.lang = lng;
        }
      } catch (e) {
        document.documentElement.dir = 'rtl';
        document.documentElement.lang = 'ar';
      }
    })();
  </script>

  <!-- Global Error Handler - Prevents app crashes -->
  <script>
    window.onerror = function (msg, source, line, col, error) {
      console.error('🚨 Error:', msg, source, line);
      if (window.location.hostname !== 'localhost') {
        // In production, send to monitoring service
        // Sentry.captureException(error);
      }
      return true; // Prevent default error handling
    };

    window.onunhandledrejection = function (e) {
      console.error('🚨 Unhandled rejection:', e.reason);
      if (window.location.hostname !== 'localhost') {
        // Sentry.captureException(e.reason);
      }
      e.preventDefault();
    };

    console.log('🛡️ Global error handler ready');
  </script>

<body>
  <!-- HTML splash: outside #root so React doesn't destroy it on mount -->
  <div id="html-splash" style="
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.35s ease;
  ">
    <div style="position: relative; width: 120px; height: 120px; display: flex; align-items: center; justify-content: center;">
      <div style="
        position: absolute; inset: 0; border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: hsl(43,75%,48%);
        animation: splash-spin 1.2s linear infinite;
      "></div>
      <img src="/favicon.png" alt="الحي" style="width: 72px; height: 72px; object-fit: contain;" />
    </div>
    <h1 style="margin-top: 24px; font-size: 2rem; font-weight: 700; color: hsl(43,75%,48%); font-family: sans-serif;">الحي</h1>
    <p style="margin-top: 8px; font-size: 0.9rem; color: hsl(43,50%,60%); font-family: sans-serif;">منصة الخدمات المحلية</p>
    <div style="margin-top: 28px; width: 120px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 99px; overflow: hidden;">
      <div style="height: 100%; background: hsl(43,75%,48%); border-radius: 99px; animation: splash-slide 1s ease-in-out infinite;"></div>
    </div>
  </div>

  <div id="root"></div>

  <style>
    #html-splash { background-color: var(--html-splash-bg, hsl(30,25%,8%)); }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
    @keyframes splash-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(400%); } }
  </style>

  <script>
    // Apply correct background from saved theme
    (function() {
      try {
        var t = localStorage.getItem('theme') || 'system';
        var dark = t === 'dark' || (t === 'auto' && (new Date().getHours() < 6 || new Date().getHours() >= 18)) || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var bg = dark ? 'hsl(30,25%,8%)' : 'hsl(38,30%,97%)';
        document.getElementById('html-splash').style.setProperty('--html-splash-bg', bg);
        document.getElementById('html-splash').style.backgroundColor = bg;
      } catch(e) {}
    })();

    // Safety net: auto-dismiss after 8 seconds if React hasn't removed it
    setTimeout(function() {
      var s = document.getElementById('html-splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function() { var s2 = document.getElementById('html-splash'); if(s2) s2.remove(); }, 400);
    }, 8000);
  </script>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
